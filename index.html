<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="updatebase" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- the two faces used above the fold, fetched in parallel with the html -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/poppins-latin-600.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/manrope-latin-400.woff2"
      crossorigin
    />

    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.dicebear.com" />

    <script>
      // runs before first paint.
      // 1. prove js is alive so reveal animations can hide their content without
      //    ever stranding it invisible for a user whose js failed to load.
      // 2. apply the saved theme now, so dark mode never flashes white.
      (function () {
        var root = document.documentElement
        root.classList.add('has-js')
        try {
          var saved = localStorage.getItem('updatebase:theme') || 'light'
          var resolved =
            saved === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : saved
          root.dataset.theme = resolved
          if (resolved === 'dark') {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0a0f19')
          }
        } catch (e) {
          root.dataset.theme = 'light'
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        updatebase needs javascript to run. please enable it and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
